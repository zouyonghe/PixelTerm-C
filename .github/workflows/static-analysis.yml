name: Static Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            -Iinclude -Isrc \
            src

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libchafa-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libavformat-dev \
            libavcodec-dev \
            libswscale-dev \
            libavutil-dev \
            libmupdf-dev

      - name: Validate MuPDF pkg-config metadata
        run: |
          pkg-config --modversion mupdf
          pkg-config --libs mupdf

      - name: Build with warnings as errors
        run: |
          make EXTRA_CFLAGS=-Werror

      - name: Run tests
        run: |
          make EXTRA_CFLAGS=-Werror test

      - name: Run debug AddressSanitizer tests
        run: |
          make EXTRA_CFLAGS=-Werror debug-test

  sanitizer-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - tsan-test
          - ubsan-test
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libchafa-dev \
            libglib2.0-dev \
            libgdk-pixbuf2.0-dev \
            libavformat-dev \
            libavcodec-dev \
            libswscale-dev \
            libavutil-dev \
            libmupdf-dev

      - name: Run ${{ matrix.target }}
        run: make EXTRA_CFLAGS=-Werror "${{ matrix.target }}"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Install build and coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            gcovr \
            libchafa-dev \
            libglib2.0-dev \
            libgdk-pixbuf2.0-dev \
            libavformat-dev \
            libavcodec-dev \
            libswscale-dev \
            libavutil-dev \
            libmupdf-dev

      - name: Run coverage tests
        run: |
          make EXTRA_CFLAGS=-Werror coverage-test
          mkdir -p coverage
          gcovr \
            --root . \
            --filter 'src/' \
            --exclude 'tests/' \
            --print-summary \
            --xml-pretty coverage/coverage.xml \
            --html-details coverage/index.html

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: coverage-report
          path: coverage

  build-and-test-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Install build dependencies
        run: |
          deps=(pkgconf glib gdk-pixbuf chafa ffmpeg mupdf)
          for dep in "${deps[@]}"; do
            if brew list --formula --versions "${dep}" >/dev/null 2>&1; then
              echo "Using Homebrew ${dep}"
            else
              brew install "${dep}"
            fi
          done
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig" >> "$GITHUB_ENV"

      - name: Build with warnings as errors
        run: |
          make EXTRA_CFLAGS=-Werror

      - name: Run tests
        run: |
          make EXTRA_CFLAGS=-Werror test

      - name: Run debug AddressSanitizer tests
        run: |
          make EXTRA_CFLAGS=-Werror debug-test
